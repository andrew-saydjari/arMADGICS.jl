# Release config for the APOGEE DR21 pass-1 0.4.0 release.
# `source` / `source_dir` are where the generator READS the files (cluster paths, read-only);
# `public_path` is what readers see, relative to `public_prefix`.

release = "0.4.0"
title = "APOGEE DR21 pass-1 (0.4.0)"
public_prefix = "data/work/mwm/0.4.0"
description = """
Data model for the APOGEE DR21 pass-1 release 0.4.0: per-exposure, per-fiber spectral components and radial velocities from arMADGICS.jl run on ApogeeReduction.jl (AR.jl) 1D spectra, a per-exposure summary table joined to the almanac observing metadata, a visit-level radial-velocity table, and the exclusion and calibration tables that go with them. Each page below documents one file (or one family of files): what it contains, how it is named, and every column with its type, shape, units and meaning.
"""

conventions = """
- **Row alignment.** Row `i` of `allExposure_pass1_dr21.h5` is row `i` of every `arMADGICS_out_<key>.h5` file: one row per (telescope, MJD, exposure, fiber). Rows are not sorted by star.
- **Telescope.** `tele` is `1` = APO, `2` = LCO in the HDF5 exposure products; the CSVs and `allVisitRV` use the strings `apo` / `lco`.
- **Fiber indices.** `adjfiberindx` runs 1–600: 1–300 are APO fibers, 301–600 are LCO fibers. The per-telescope product fiber index is `fiber = adjfiberindx - 300*(tele-1)` (1–300); this is the `fiber` used by the CSVs and `allVisitRV`. The almanac / APOGEE FIBERID runs the other way: `fiber_index_almanac = FIBERID = 301 - fiber`.
- **Era.** `era` is `1` = plate era, `2` = FPS (robotic fiber positioner) era.
- **Wavelength grid.** Every spectral array has 8700 pixels on a log-uniform vacuum wavelength grid, `wave_j = 10^(4.17825 + 6e-6 (j-1))` Å for `j = 1..8700` (about 15,075–17,000 Å). Spectra are in the observed (topocentric) frame; one pixel is a velocity step of `c ln(10) 6e-6` ≈ 4.14 km/s.
- **Velocity frames.** `v_rel` is the observed (topocentric) velocity, with no barycentric correction. `v_rad` is barycentric. `v_rad_corr = v_rad - v_rad_offset_applied` additionally removes the per-fiber zero point from `fiber_offsets.csv`. All velocities are in km/s.
- **Missing values.** Floating-point columns use NaN for "not available". Integer identifier columns copied from the almanac use `-1` where the identifier does not exist (for example `plate_id` in the FPS era, `config_id` in the plate era).
- **Array order.** Shapes are given in Julia (column-major) order, with the row axis written `N`; h5py and other row-major readers see the reverse order. A spectrum is `f["flux"][:, i]` in Julia and `f["flux"][i, :]` in h5py.
"""

