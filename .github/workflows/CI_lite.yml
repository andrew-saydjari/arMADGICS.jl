name: CI_lite
on:
  push:
    branches:
      - main
    tags: ['*']
  workflow_call:
  workflow_dispatch:
  pull_request:
jobs:
  shell_tests:
    # Syntax-checks the workup launchers and runs the lmod/nounset regression test.
    # GitHub runners have no lmod, so test_module_setup.sh prints SKIP and exits 0 there;
    # it only exercises the module stack on a Flatiron node.
    name: Shell scripts (bash -n + module-setup test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in workup/run_workup.sh scripts/lib_lmod.sh scripts/lib_julia_warm.sh \
                   workup/mpi_env/setup_mpi_env.sh workup/test/test_module_setup.sh; do
            bash -n "$f"
          done
      - run: bash workup/test/test_module_setup.sh
  test_lite:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11.1' #1.11.0 is current production v, should update
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
